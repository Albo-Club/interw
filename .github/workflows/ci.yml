name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA, the tag it resolved to alongside: a tag
# can be moved to other code, a SHA cannot. Renovate bumps both together.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same PR makes this run moot. Set on the job, not the
    # workflow: a workflow-level group would also cancel e2e halfway through
    # its staging deploy, which e2e's own group exists to prevent. Never on
    # main, so every merged commit keeps its result.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No `version:` — the action reads `packageManager` from package.json,
      # so CI, Corepack and Vercel all resolve the same pnpm. Never re-pin here.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runtime dependencies only: build-chain advisories do not reach a user.
      # Red → an override in package.json `pnpm.overrides`, or a lockfile
      # refresh when a patched version is already in range (KNOWN_ISSUES.md).
      - run: pnpm audit --prod --audit-level=high
      # Catches a Convex module added without its codegen committed — CI has
      # no deployment, so `npx convex dev` cannot do it here.
      - run: pnpm codegen:api:check
      # "Verified function by function, not assumed" only stays true if
      # something keeps verifying. Fails on a public Convex function with no
      # access check — see scripts/audit-convex-access.mjs.
      - run: pnpm audit:access:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Fails above 270 KiB gzip on the candidate interview screen.
      - run: pnpm bundle:budget

  # The candidate interview in real browsers (e2e/interview.spec.ts), Chromium
  # and WebKit, on fake camera and microphone. Its only backend is staging, so
  # the job first deploys this branch's Convex functions there: a PR run
  # replaces what `main` put on staging until the next deploy. Only code that
  # passed `check` gets that far, one run at a time, never cancelled halfway
  # through a deploy.
  #
  # Not on pull requests while the product is being built: staging is a single
  # deployment, so per-PR runs queue one behind another and each one overwrites
  # staging with unmerged code. It runs after every merge to `main` and on
  # demand (Actions → CI → Run workflow, on any branch). Once real candidates
  # depend on it, drop the `if:` to gate every PR again.
  e2e:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
      MEDIA_ORIGIN: ${{ secrets.MEDIA_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A missing secret fails here, by name, instead of as a blank page three
      # steps later. Never skip the job when one is missing: say it can't run.
      - name: Check the staging secrets are set
        run: ': "${CONVEX_DEPLOY_KEY:?}" "${VITE_CONVEX_SITE_URL:?}" "${MEDIA_ORIGIN:?}"'
      # Deploys, then builds with VITE_CONVEX_URL set to what was deployed: the
      # browser and the seed cannot end up on two different deployments.
      - run: pnpm build
        env:
          DEPLOY_CONVEX: 'true'
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      - run: pnpm test:e2e
      # The report carries the recording-screen captures and, on failure, the
      # trace.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # Two jobs, two distinct questions — keep both:
  #   skills-verify  "is my tree intact?"    offline, deterministic
  #   skills-drift   "has upstream moved?"   needs the network
  # The sync script is dependency-free, so neither needs `pnpm install`.

  # Local integrity (TESTING.md B6): does `.agents/skills` still hold exactly
  # what `skills-lock.json` says we vendored? Offline, so this job can't go red
  # on a raw.githubusercontent.com hiccup. When it does go red, a vendored file
  # was hand-edited or is missing: `pnpm run sync:skills` repairs it (no
  # `--force` needed), then review the diff — see CLAUDE.md.
  skills-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs --verify

  # Upstream skill drift (TESTING.md B6b). Kept in CI here because this repo
  # has no weekly sync cron to catch drift otherwise — it was deliberately
  # removed (see KNOWN_ISSUES.md § "sync-skills.yml (cron + auto-PR) was
  # removed"). When this goes red: run `pnpm run sync:skills:update`, review
  # the SKILL.md diff, commit. Don't mute the check — see CLAUDE.md.
  skills-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs --check
